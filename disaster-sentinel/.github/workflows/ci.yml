name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci-only-password@127.0.0.1:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements/dev.txt
      - run: shellcheck scripts/*.sh
      - run: python scripts/validate_deploy.py
      - run: python -m pytest tests -q

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Containerfile --target core -t sentinel-core .
      - run: docker build -f deploy/Containerfile --target classifier -t sentinel-classifier .
      - name: Publish on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for name in core classifier; do
            docker tag "sentinel-$name" "ghcr.io/$owner/sentinel-$name:$GITHUB_REF_NAME"
            docker push "ghcr.io/$owner/sentinel-$name:$GITHUB_REF_NAME"
          done
